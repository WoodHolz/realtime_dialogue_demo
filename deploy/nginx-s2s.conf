# Drop into the existing HTTPS server for dev.gameday.tech, e.g.
#   /etc/nginx/sites-available/dev.gameday.tech
# or include from that server block:
#   include /home/ubuntu/realtime_voice_interviewer_demo/deploy/nginx-s2s.conf;
#
# Public URLs:
#   https://dev.gameday.tech/s2s/voice?...  ->  http://127.0.0.1:7998/voice
#   wss://dev.gameday.tech/ws               ->  http://127.0.0.1:7998/ws
#
# App listens on 7998.

location /s2s/ {
    proxy_pass http://127.0.0.1:7998/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

location /ws {
    proxy_pass http://127.0.0.1:7998/ws;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
}
