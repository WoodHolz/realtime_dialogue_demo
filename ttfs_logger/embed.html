<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TTFS embed</title>
  <style>
    :root {
      --bg: #0f1218;
      --panel: #171b24;
      --text: #e8ecf4;
      --muted: #8b93a7;
      --grid: #2a3142;
      --accent: #fbbf24;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, "PingFang SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.35;
      font-size: 13px;
    }
    .embed-root { padding: 8px; display: flex; flex-direction: column; gap: 8px; max-width: 100%; }
    .controls {
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      background: var(--panel); padding: 8px; border-radius: 8px; border: 1px solid var(--grid);
    }
    button {
      border: none; border-radius: 6px; padding: 0.4rem 0.65rem; font-weight: 600; cursor: pointer; font-size: 0.78rem;
    }
    button.primary { background: linear-gradient(180deg, #22d3ee 0%, #06b6d4 100%); color: #041016; }
    button.secondary { background: #3730a3; color: #eef; }
    button.ghost { background: #252b38; color: var(--text); border: 1px solid var(--grid); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    label.chk-inline {
      display: flex; align-items: center; gap: 0.35rem; font-size: 0.72rem; color: var(--muted); cursor: pointer; user-select: none;
    }
    label.chk-inline input { accent-color: #5eead4; width: 0.95rem; height: 0.95rem; }
    .metrics {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      background: var(--panel); padding: 8px; border-radius: 8px; border: 1px solid var(--grid);
    }
    .big { font-size: 1.35rem; font-weight: 750; font-variant-numeric: tabular-nums; color: var(--accent); }
    .hint { font-size: 0.72rem; color: var(--muted); }
    .knobs { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
    .knobs label { font-size: 0.62rem; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
    .knobs input[type="range"] { width: 100px; }
    .main { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
    #panelMedia.panel-media {
      display: flex; gap: 8px; align-items: flex-end; padding: 8px;
      background: var(--panel); border: 1px solid var(--grid); border-radius: 8px;
    }
    .strip-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .strip-label { font-size: 0.58rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
    canvas.waveformCanvas {
      display: block; width: 88px; height: 160px; border-radius: 6px; background: #0a0c10; border: 1px solid #1c2230;
    }
    .timeline-wrap {
      flex: 1 1 200px; min-width: 180px; background: var(--panel); border: 1px solid var(--grid); border-radius: 8px; padding: 8px;
    }
    .timeline-wrap h2 {
      margin: 0 0 6px; font-size: 0.62rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
    }
    canvas#timelineCanvas {
      display: block; width: 100%; height: 140px; border-radius: 6px; background: #0a0c10; border: 1px solid #1c2230;
    }
    #log { font-family: ui-monospace, monospace; font-size: 0.68rem; color: var(--muted); min-height: 1rem; margin: 0; }
    #log.err { color: var(--danger); }
    video#keepAlive { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  </style>
</head>
<!--
  Embedded widget — load in iframe from SAME ORIGIN as your demo parent page.
  Parent: iframe.contentWindow.TTFS.cloneMicForConsumer()
  Optional: data-ttfs-parent-origin="https://your-app.example" for stricter postMessage
-->
<body data-ttfs-parent-origin="*">
  <div class="embed-root">
    <div class="controls">
      <button type="button" class="primary" id="btnMic">Mic</button>
      <button type="button" class="secondary" id="btnShare">Playback</button>
      <button type="button" class="ghost" id="btnStop">Stop</button>
      <label class="chk-inline">
        <input type="checkbox" id="chkVoice" /> DSP
      </label>
      <span class="hint" id="stateLab">idle</span>
    </div>

    <div class="metrics">
      <div>
        <div class="hint">Latency</div>
        <div class="big" id="latMs">—</div>
      </div>
      <div class="knobs">
        <label>Mic <span id="labMicT"></span><input type="range" id="rngMic" min="0.002" max="0.08" step="0.001" value="0.018" /></label>
        <label>Pb <span id="labPbT"></span><input type="range" id="rngPb" min="0.002" max="0.12" step="0.001" value="0.012" /></label>
        <label>Hang ms <span id="labHang"></span><input type="range" id="rngHang" min="80" max="900" step="10" value="320" /></label>
      </div>
    </div>

    <div class="main">
      <div id="panelMedia" class="panel-media">
        <div class="strip-wrap">
          <span class="strip-label">Mic</span>
          <canvas id="waveformCanvasMic" class="waveformCanvas" width="117" height="218"></canvas>
        </div>
        <div class="strip-wrap">
          <span class="strip-label">PB</span>
          <canvas id="waveformCanvasPlayback" class="waveformCanvas" width="117" height="218"></canvas>
        </div>
      </div>
      <div class="timeline-wrap">
        <h2>Timeline</h2>
        <canvas id="timelineCanvas" width="640" height="200"></canvas>
      </div>
    </div>

    <p id="log"></p>
  </div>

  <video id="keepAlive" autoplay muted playsinline></video>
  <script src="/static/ttfs-app.js" defer></script>
</body>
</html>
