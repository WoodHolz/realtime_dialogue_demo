<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>eot_bench — LiveKit Turn Detector</title>
  <style>
    :root {
      --bg: #0f1218;
      --panel: #171b24;
      --text: #e8ecf4;
      --muted: #8b93a7;
      --line: #2a3142;
      --accent: #34d399;
      --btn: #2563eb;
      --bad: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, "Segoe UI", "PingFang SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1.25rem 1.5rem 3rem;
      max-width: 960px;
      margin-inline: auto;
    }
    h1 { font-size: 1.35rem; margin: 0 0 0.35rem; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.25rem; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1rem 1.1rem 1.25rem;
    }
    label { display: block; font-size: 0.82rem; color: var(--muted); margin: 0.65rem 0 0.25rem; }
    input, select {
      width: 100%;
      background: #0f1218;
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 8px;
      padding: 0.5rem 0.65rem;
      font: inherit;
    }
    .row { display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem; }
    .row > div { flex: 1 1 140px; }
    .checks { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 0.75rem; }
    .checks label { display: flex; align-items: center; gap: 0.4rem; margin: 0; color: var(--text); }
    button.run {
      margin-top: 1rem;
      background: var(--btn);
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 0.55rem 1.1rem;
      font: inherit;
      cursor: pointer;
    }
    button.run:disabled { opacity: 0.5; cursor: wait; }
    pre {
      margin-top: 1rem;
      background: #0b0e14;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.85rem;
      overflow: auto;
      font-size: 0.8rem;
      max-height: 55vh;
    }
    .err { color: var(--bad); }
    .ok { color: var(--accent); }
  </style>
</head>
<body>
  <h1>eot_bench</h1>
  <p class="sub">LiveKit Turn Detector v1 / v1-mini on <code>livekit/eot-bench-data</code> — independent of pipeline.</p>

  <div class="panel">
    <div class="row">
      <div>
        <label>Limit (turns / lang)</label>
        <input id="limit" type="number" min="1" max="100" value="10" />
      </div>
      <div>
        <label>Languages</label>
        <input id="langs" type="text" value="zh" placeholder="zh,en" />
      </div>
    </div>
    <div class="checks">
      <label><input type="checkbox" id="m_v1" checked /> v1 (cloud)</label>
      <label><input type="checkbox" id="m_mini" /> v1-mini (local)</label>
    </div>
    <button class="run" id="runBtn" type="button">Run smoke</button>
    <pre id="out">Loading meta…</pre>
  </div>

  <script>
    const out = document.getElementById("out");
    async function loadMeta() {
      try {
        const r = await fetch("/api/eot-bench/meta");
        const j = await r.json();
        out.textContent = JSON.stringify(j, null, 2);
      } catch (e) {
        out.className = "err";
        out.textContent = String(e);
      }
    }
    document.getElementById("runBtn").onclick = async () => {
      const models = [];
      if (document.getElementById("m_v1").checked) models.push("v1");
      if (document.getElementById("m_mini").checked) models.push("v1-mini");
      if (!models.length) { out.className = "err"; out.textContent = "select a model"; return; }
      const body = {
        models,
        langs: document.getElementById("langs").value.split(",").map(s => s.trim()).filter(Boolean),
        limit: Number(document.getElementById("limit").value) || 10,
      };
      const btn = document.getElementById("runBtn");
      btn.disabled = true;
      out.className = "";
      out.textContent = "Running… (v1 hits LiveKit Inference; may take a few minutes)";
      try {
        const r = await fetch("/api/eot-bench/smoke", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const j = await r.json();
        if (!r.ok) throw new Error(j.detail || JSON.stringify(j));
        out.className = "ok";
        out.textContent = JSON.stringify(j, null, 2);
      } catch (e) {
        out.className = "err";
        out.textContent = String(e);
      } finally {
        btn.disabled = false;
      }
    };
    loadMeta();
  </script>
</body>
</html>
