<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SIP 外呼测试</title>
  <style>
    :root {
      --bg: #f3efe6;
      --ink: #1c1914;
      --muted: #6b6458;
      --line: #d4cbb8;
      --accent: #0f5c4c;
      --accent-soft: #dceee8;
      --card: #fffdf8;
      --danger: #9b2c2c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans", "Noto Sans SC", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, #e8f2ee 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 0%, #f0e6d4 0%, transparent 50%),
        var(--bg);
    }
    main {
      width: min(720px, calc(100% - 2rem));
      margin: 2.5rem auto 3rem;
    }
    h1 {
      font-family: "Fraunces", "Noto Serif SC", Georgia, serif;
      font-weight: 600;
      font-size: clamp(1.6rem, 4vw, 2rem);
      margin: 0 0 0.35rem;
      letter-spacing: -0.02em;
    }
    h2 {
      font-size: 0.95rem;
      margin: 1.25rem 0 0.6rem;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .lead {
      color: var(--muted);
      margin: 0 0 1.5rem;
      line-height: 1.5;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1.25rem 1.35rem 1.4rem;
      box-shadow: 0 12px 40px rgba(28, 25, 20, 0.06);
    }
    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      margin: 0.85rem 0 0.35rem;
    }
    label:first-of-type { margin-top: 0; }
    input, select, button, textarea {
      font: inherit;
      width: 100%;
    }
    input, select, textarea {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.65rem 0.75rem;
      background: #fff;
      color: var(--ink);
    }
    textarea {
      min-height: 5.5rem;
      resize: vertical;
      line-height: 1.45;
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid var(--accent-soft);
      border-color: var(--accent);
    }
    .hint {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.35rem;
    }
    .hint code {
      font-size: 0.85em;
      background: var(--accent-soft);
      padding: 0.05rem 0.3rem;
      border-radius: 4px;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .row-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.75rem;
    }
    @media (max-width: 640px) {
      .row, .row-3 { grid-template-columns: 1fr; }
    }
    .check {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.85rem;
      font-size: 0.86rem;
    }
    .check input {
      width: auto;
      margin: 0;
    }
    button#callBtn {
      margin-top: 1.15rem;
      border: 0;
      border-radius: 999px;
      padding: 0.8rem 1rem;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button#callBtn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    button#callBtn:hover:not(:disabled) {
      filter: brightness(1.05);
    }
    .status {
      margin-top: 1rem;
      padding: 0.85rem 0.95rem;
      border-radius: 10px;
      background: #f7f3ea;
      border: 1px solid var(--line);
      font-size: 0.86rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 3.2rem;
    }
    .status.err { border-color: #e8b4b4; background: #fff5f5; color: var(--danger); }
    .preview {
      margin-top: 0.5rem;
      padding: 0.75rem 0.85rem;
      border-radius: 10px;
      background: var(--accent-soft);
      border: 1px solid #b8d9ce;
      font-size: 0.86rem;
      line-height: 1.5;
      color: var(--ink);
    }
    .back {
      display: inline-block;
      margin-bottom: 1rem;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
    }
    .back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../">← 返回首页</a>
    <h1>SIP 外呼测试</h1>
    <p class="lead">催授权场景联调：配置剧本槽位、预览开场白，发起 SIP 外呼。被叫自动加 <code>a1</code> 前缀；外显号由服务端自动分配。</p>

    <form class="panel" id="form">
      <h2>拨号</h2>
      <label for="phone">被测手机号</label>
      <input id="phone" type="tel" inputmode="numeric" placeholder="例如 18324133080" required autocomplete="tel" />
      <p class="hint">外显号由服务端从号池自动分配（<code>SIP_DEFAULT_DISPLAY</code> / <code>config.json</code>），测试页无需选择。</p>

      <h2>剧本槽位（催授权）</h2>
      <div class="row">
        <div>
          <label for="candidate">候选人称呼</label>
          <input id="candidate" type="text" value="张先生" />
        </div>
        <div>
          <label for="identityMode">身份模式</label>
          <select id="identityMode">
            <option value="CLIENT_IDENTITY">白标（以客户B名义）</option>
            <option value="BRAND_SELF">芝麻背调 + 受托（直客三要素）</option>
          </select>
          <p class="hint">白标：下单客户 A 以客户 B 名义外呼（渠道白标=客户白标）。直客：我方品牌 + 受委托方委托。</p>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="client" id="clientLabel">对外自称品牌（客户B）</label>
          <input id="client" type="text" value="比赛日科技" />
        </div>
        <div id="ourBrandWrap" style="display:none">
          <label for="ourBrand">我方品牌</label>
          <input id="ourBrand" type="text" value="芝麻背调" />
        </div>
      </div>
      <div class="row">
        <div>
          <label for="inviteSubject">邀请主题</label>
          <input id="inviteSubject" type="text" value="背调采集邀请" />
        </div>
        <div>
          <label for="inviteChannel">发送渠道</label>
          <input id="inviteChannel" type="text" value="短信" placeholder="短信 / 短信和邮箱" />
        </div>
      </div>

      <div class="row-3">
        <div>
          <label for="phoneTail">手机尾号</label>
          <input id="phoneTail" type="text" placeholder="四位，如 3080" maxlength="4" />
        </div>
        <div>
          <label for="deadline">完成时限</label>
          <input id="deadline" type="text" value="一个工作日内" />
        </div>
        <div>
          <label for="sendTime">发送时间锚点</label>
          <input id="sendTime" type="text" placeholder="如 今天上午" />
        </div>
      </div>

      <label class="check">
        <input id="hasEmail" type="checkbox" />
        已配置邮件渠道（开场白用「短信或邮件」）
      </label>

      <label class="check">
        <input id="hasFallbackSms" type="checkbox" />
        已配置兜底短信（启用公众号指引级联）
      </label>

      <div class="row">
        <div>
          <label for="reservedEmail">预留邮箱（可选）</label>
          <input id="reservedEmail" type="text" placeholder="如 zhangsan@example.com" />
        </div>
        <div>
          <label for="resendChannel">补发提醒渠道</label>
          <input id="resendChannel" type="text" value="短信" placeholder="短信 / 邮件 / 其它" />
        </div>
      </div>

      <div class="row">
        <div>
          <label for="mpName">公众号名称（可选）</label>
          <input id="mpName" type="text" placeholder="如 背调助手" />
        </div>
        <div>
          <label for="hotline">回拨号码（可选）</label>
          <input id="hotline" type="text" placeholder="如 400-000-0000" />
        </div>
      </div>

      <label for="fallbackSmsBody">兜底短信正文（可选）</label>
      <textarea id="fallbackSmsBody" placeholder="如：请关注公众号并按短信提示完成授权"></textarea>

      <h2>开场白预览</h2>
      <div class="preview" id="openingPreview">填写上方槽位后自动预览…</div>
      <p class="hint">接通后 AI 将按此文案开场（方案2）。槽位与 <code>POST /outbound/v1/calls</code> 一致。</p>

      <label for="apiKey">X-API-Key（可选）</label>
      <input id="apiKey" type="password" placeholder="PARTNER_API_KEY 为空时可留空" autocomplete="off" />

      <button type="submit" id="callBtn">发起外呼</button>
      <div class="status" id="status"><!--__STATUS_BOOT__--></div>
    </form>
  </main>

  <script type="application/json" id="sip-call-boot"><!--__SIP_CALL_BOOT_JSON__--></script>
  <script>
    (function () {
      var pathPrefix = location.pathname.indexOf("/s2s/") === 0 || location.pathname === "/s2s"
        ? "/s2s"
        : "";
      var API_BASE = pathPrefix + "/outbound/v1";
      var bootEl = document.getElementById("sip-call-boot");
      var boot = {};
      try {
        boot = JSON.parse((bootEl && bootEl.textContent) || "{}");
      } catch (e) {
        boot = {};
      }
      var calledPrefix = boot.called_prefix || "a1";
      var pollTimer = null;
      var previewTimer = null;

      var el = {
        phone: document.getElementById("phone"),
        candidate: document.getElementById("candidate"),
        client: document.getElementById("client"),
        clientLabel: document.getElementById("clientLabel"),
        identityMode: document.getElementById("identityMode"),
        ourBrand: document.getElementById("ourBrand"),
        ourBrandWrap: document.getElementById("ourBrandWrap"),
        inviteSubject: document.getElementById("inviteSubject"),
        inviteChannel: document.getElementById("inviteChannel"),
        phoneTail: document.getElementById("phoneTail"),
        deadline: document.getElementById("deadline"),
        sendTime: document.getElementById("sendTime"),
        hasEmail: document.getElementById("hasEmail"),
        hasFallbackSms: document.getElementById("hasFallbackSms"),
        reservedEmail: document.getElementById("reservedEmail"),
        resendChannel: document.getElementById("resendChannel"),
        mpName: document.getElementById("mpName"),
        hotline: document.getElementById("hotline"),
        fallbackSmsBody: document.getElementById("fallbackSmsBody"),
        openingPreview: document.getElementById("openingPreview"),
        apiKey: document.getElementById("apiKey"),
        status: document.getElementById("status"),
        form: document.getElementById("form"),
        callBtn: document.getElementById("callBtn"),
      };

      function headers() {
        var h = { "Content-Type": "application/json" };
        var key = (el.apiKey.value || "").trim();
        if (key) h["X-API-Key"] = key;
        return h;
      }

      function normalizePhone(raw) {
        return String(raw || "").replace(/[\s\-()]/g, "").trim();
      }

      function withPrefix(phone) {
        var p = normalizePhone(phone);
        if (!p) return "";
        if (p.toLowerCase().indexOf(calledPrefix.toLowerCase()) === 0) return p;
        return calledPrefix + p.replace(/^\+/, "");
      }

      function setStatus(text, isErr) {
        el.status.textContent = text;
        el.status.classList.toggle("err", !!isErr);
      }

      function syncIdentityFields() {
        var brandSelf = el.identityMode.value === "BRAND_SELF";
        if (el.ourBrandWrap) el.ourBrandWrap.style.display = brandSelf ? "" : "none";
        if (el.clientLabel) {
          el.clientLabel.textContent = brandSelf ? "委托方" : "对外自称品牌（客户B）";
        }
      }

      function payloadFromForm() {
        var brandSelf = el.identityMode.value === "BRAND_SELF";
        var body = {
          phone: normalizePhone(el.phone.value) || "13800000000",
          scenario: "urge_auth",
          // 外显号由服务端号池自动分配，页面不传 display
          candidate_name: (el.candidate.value || "").trim() || "张先生",
          // 白标：对外自称品牌(B)；BRAND_SELF：委托方
          client_name: (el.client.value || "").trim() || "比赛日科技",
          identity_mode: el.identityMode.value,
          our_brand_name: brandSelf ? ((el.ourBrand.value || "").trim() || "芝麻背调") : "",
          invite_subject: (el.inviteSubject.value || "").trim() || "背调采集邀请",
          invite_channel: (el.inviteChannel.value || "").trim() || "短信",
          phone_tail: (el.phoneTail.value || "").trim(),
          deadline: (el.deadline.value || "").trim() || "一个工作日内",
          send_time: (el.sendTime.value || "").trim(),
          has_email: !!el.hasEmail.checked,
          has_fallback_sms: !!el.hasFallbackSms.checked,
          reserved_email: (el.reservedEmail.value || "").trim(),
          resend_channel: (el.resendChannel.value || "").trim() || "短信",
          mp_name: (el.mpName.value || "").trim(),
          hotline: (el.hotline.value || "").trim(),
          fallback_sms_body: (el.fallbackSmsBody.value || "").trim(),
        };
        return body;
      }

      function schedulePreview() {
        if (previewTimer) clearTimeout(previewTimer);
        previewTimer = setTimeout(refreshOpeningPreview, 350);
      }

      async function refreshOpeningPreview() {
        el.openingPreview.textContent = "预览生成中…";
        try {
          var resp = await fetch(API_BASE + "/preview-opening", {
            method: "POST",
            headers: headers(),
            body: JSON.stringify(payloadFromForm()),
          });
          var raw = await resp.text();
          var data = {};
          try { data = JSON.parse(raw); } catch (e) { data = {}; }
          if (!resp.ok) {
            el.openingPreview.textContent = data.detail || raw || "预览失败";
            return;
          }
          el.openingPreview.textContent =
            (data.opening_parts && data.opening_parts.length)
              ? data.opening_parts.join("\n\n")
              : (data.opening_line || "（空）");
        } catch (err) {
          el.openingPreview.textContent = String(err.message || err);
        }
      }

      function foreignApiHint(data, rawText) {
        var looksForeign = (data && data.code === 404 && data.msg) || /"msg"\s*:\s*"Not Found"/.test(rawText || "");
        if (!looksForeign) return "";
        return (
          "\n\n当前页: " + window.location.href +
          "\n请求: " + API_BASE +
          "\n返回体像其它网关。请用 https://dev.gameday.tech/s2s/sip-call 或 http://<主机>:7998/sip-call"
        );
      }

      function pollCall(callId) {
        if (pollTimer) clearInterval(pollTimer);
        pollTimer = setInterval(async function () {
          try {
            var resp = await fetch(API_BASE + "/calls/" + callId, { headers: headers() });
            if (!resp.ok) return;
            var data = await resp.json();
            var dial = data.telephony && data.telephony.dial;
            var sip = data.telephony && data.telephony.sip;
            var line =
              "call_id=" + data.call_id +
              "\nstatus=" + data.status +
              (data.result ? ("\nresult=" + data.result) : "") +
              (dial ? ("\ncalled=" + dial.called + " display=" + dial.display) : "");
            if (sip && sip.status) line += "\nsip_status=" + sip.status;
            if (sip && sip.error) line += "\nsip=" + sip.error;
            if (data.error) line += "\nerror=" + data.error;
            if (data.result_summary) line += "\n" + data.result_summary;
            setStatus(line, data.status === "failed");
            if (data.status === "completed" || data.status === "failed") {
              clearInterval(pollTimer);
              pollTimer = null;
              el.callBtn.disabled = false;
            }
          } catch (e) { /* keep polling */ }
        }, 2000);
      }

      [
        "candidate", "client", "identityMode", "ourBrand",
        "inviteSubject", "inviteChannel", "phoneTail", "deadline", "sendTime", "hasEmail",
        "hasFallbackSms", "reservedEmail", "resendChannel", "mpName", "hotline", "fallbackSmsBody"
      ].forEach(function (id) {
        var node = el[id];
        if (!node) return;
        node.addEventListener("input", schedulePreview);
        node.addEventListener("change", schedulePreview);
      });
      el.identityMode.addEventListener("change", function () {
        syncIdentityFields();
        schedulePreview();
      });
      syncIdentityFields();

      el.form.addEventListener("submit", async function (e) {
        e.preventDefault();
        var phone = normalizePhone(el.phone.value);
        if (!phone) {
          setStatus("请填写手机号", true);
          return;
        }
        el.callBtn.disabled = true;
        var body = payloadFromForm();
        body.phone = phone;
        setStatus("正在发起外呼…\n实际被叫 " + withPrefix(phone) + "\nPOST " + API_BASE + "/calls");
        try {
          var resp = await fetch(API_BASE + "/calls", {
            method: "POST",
            headers: headers(),
            body: JSON.stringify(body),
          });
          var rawText = await resp.text();
          var data = {};
          try { data = JSON.parse(rawText); } catch (err) { data = {}; }
          if (!resp.ok) {
            throw new Error((data.detail || rawText || resp.statusText) + foreignApiHint(data, rawText));
          }
          var dial = data.dial || {};
          setStatus(
            "已创建 call_id=" + data.call_id +
            "\nstatus=" + data.status +
            "\ncalled=" + (dial.called || withPrefix(phone)) +
            "\ndisplay=" + (dial.display || "(服务端自动分配)") +
            (data.opening_line ? ("\n\n开场白：\n" + data.opening_line) : "") +
            "\n\n轮询中…"
          );
          pollCall(data.call_id);
        } catch (err) {
          setStatus(String(err.message || err), true);
          el.callBtn.disabled = false;
        }
      });

      refreshOpeningPreview();
    })();
  </script>
</body>
</html>
