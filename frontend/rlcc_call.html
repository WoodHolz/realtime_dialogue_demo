<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>芝麻背调 · 容联云电话 + AI 访谈</title>
  <style>
    :root {
      --bg: #0f1218;
      --panel: #171b24;
      --text: #e8ecf4;
      --muted: #8b93a7;
      --grid: #2a3142;
      --accent: #22d3ee;
      --warn: #fbbf24;
      --danger: #f87171;
      --ok: #5eead4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, "PingFang SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--grid);
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { margin: 0; font-size: 1.1rem; font-weight: 650; }
    header p { margin: 0; font-size: 0.82rem; color: var(--muted); }
    main {
      display: grid;
      grid-template-columns: minmax(280px, 360px) 1fr;
      gap: 1rem;
      padding: 1rem 1.25rem 2rem;
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--grid);
      border-radius: 12px;
      padding: 1rem;
    }
    .card h2 {
      margin: 0 0 0.75rem;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin: 0.55rem 0 0.25rem;
    }
    input, select {
      width: 100%;
      padding: 0.45rem 0.55rem;
      border-radius: 8px;
      border: 1px solid var(--grid);
      background: #0a0c10;
      color: var(--text);
      font-size: 0.85rem;
    }
    .btn-row { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.75rem; }
    button {
      border: none;
      border-radius: 8px;
      padding: 0.45rem 0.75rem;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
    }
    button.primary { background: linear-gradient(180deg, #22d3ee, #06b6d4); color: #041016; }
    button.secondary { background: #252b38; color: var(--text); border: 1px solid var(--grid); }
    button.danger { background: #3f1515; color: #fecaca; border: 1px solid #7f1d1d; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .status-pill {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      background: #252b38;
      color: var(--muted);
    }
    .status-pill.ok { background: #0d2826; color: var(--ok); }
    .status-pill.warn { background: #2a2208; color: var(--warn); }
    .status-pill.err { background: #2a1010; color: var(--danger); }
    .transcript {
      white-space: pre-wrap;
      min-height: 200px;
      max-height: 420px;
      overflow: auto;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--grid);
      background: #0a0c10;
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .log {
      margin-top: 0.75rem;
      font-family: ui-monospace, monospace;
      font-size: 0.72rem;
      color: var(--muted);
      max-height: 140px;
      overflow: auto;
    }
    .log .err { color: var(--danger); }
    .hint { font-size: 0.75rem; color: var(--muted); line-height: 1.45; margin: 0.5rem 0 0; }
    .cc-toolbar { margin-top: 0.5rem; }
    audio { display: none; }
    .ai-controls { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--grid); }
    label.chk { display: flex; align-items: center; gap: 0.4rem; font-size: 0.78rem; color: var(--text); cursor: pointer; }
    label.chk input { width: auto; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>芝麻背调 · 容联云电话 + AI 访谈</h1>
      <p>WebRTC 软话机外呼，可选将对方语音桥接到 Omni 实时语音 Agent（背调话术）。</p>
    </div>
    <span class="status-pill" id="globalStatus">初始化</span>
  </header>

  <main>
    <section class="card" id="phonePanel">
      <h2>容联云坐席</h2>
      <label for="url3cs">3CS 服务地址</label>
      <input id="url3cs" placeholder="https://xxx.acloudcc.com/3cs" />

      <label for="companyId">企业 ID (company_id)</label>
      <input id="companyId" placeholder="300" />

      <label for="operatorId">坐席工号</label>
      <input id="operatorId" placeholder="10001" />

      <label for="password">坐席密码（明文，页面内 MD5 后登录）</label>
      <input id="password" type="password" placeholder="******" />

      <label for="called">外呼号码</label>
      <input id="called" placeholder="13800138000" />

      <div class="btn-row cc-toolbar">
        <button class="primary" id="btnLogin">签入 WebRTC</button>
        <button class="secondary" id="btnIdle">示闲</button>
        <button class="secondary" id="btnCall">外呼</button>
        <button class="danger" id="btnHangup">挂机</button>
        <button class="secondary" id="btnLogout">签出</button>
      </div>

      <p class="hint">
        SDK 默认从容联云官方 demo CDN 加载；可在 config.json / RLCC_SDK_BASE_URL 改为本地 static。
        生产环境需 HTTPS。
      </p>

      <div class="ai-controls">
        <h2>AI 辅助（可选）</h2>
        <label class="chk">
          <input type="checkbox" id="aiBridge" />
          通话中将对方语音送入 Omni Agent（/ws-omni）
        </label>
        <div class="btn-row">
          <button class="secondary" id="btnAiStart">启动 AI 会话</button>
          <button class="secondary" id="btnAiStop" disabled>停止 AI</button>
        </div>
      </div>

      <div class="log" id="phoneLog"></div>
    </section>

    <section class="card">
      <h2>访谈转写 / AI 回复</h2>
      <div class="transcript" id="transcript">等待签入或启动 AI 会话…</div>
      <div class="log" id="aiLog"></div>
    </section>
  </main>

  <audio id="localVideo" autoplay></audio>
  <audio id="remoteVideo" autoplay></audio>
  <audio id="ringingVideo" loop></audio>
  <audio id="ringingBackVideo"></audio>

  <script>
    const SDK_SCRIPTS = [
      'janus/adapter-latest.js',
      'language.js',
      'janus/janus.js',
      'CallCenter.js',
    ];

    const state = {
      sdkBase: 'https://cc.yuntongxun.com/ccc/public/cc_sdk',
      rlcc: {},
      ws: null,
      aiActive: false,
      audioCtx: null,
      bridgeNodes: [],
    };

    const els = {
      globalStatus: document.getElementById('globalStatus'),
      url3cs: document.getElementById('url3cs'),
      companyId: document.getElementById('companyId'),
      operatorId: document.getElementById('operatorId'),
      password: document.getElementById('password'),
      called: document.getElementById('called'),
      transcript: document.getElementById('transcript'),
      phoneLog: document.getElementById('phoneLog'),
      aiLog: document.getElementById('aiLog'),
      aiBridge: document.getElementById('aiBridge'),
    };

    function logPhone(msg, isErr) {
      const line = document.createElement('div');
      if (isErr) line.className = 'err';
      line.textContent = new Date().toLocaleTimeString() + ' ' + msg;
      els.phoneLog.prepend(line);
    }

    function logAi(msg, isErr) {
      const line = document.createElement('div');
      if (isErr) line.className = 'err';
      line.textContent = new Date().toLocaleTimeString() + ' ' + msg;
      els.aiLog.prepend(line);
    }

    function setGlobalStatus(text, kind) {
      els.globalStatus.textContent = text;
      els.globalStatus.className = 'status-pill' + (kind ? ' ' + kind : '');
    }

    function appendTranscript(speaker, text) {
      if (!text) return;
      const prefix = els.transcript.textContent.startsWith('等待') ? '' : els.transcript.textContent + '\n';
      els.transcript.textContent = prefix + `[${speaker}] ${text}`;
      els.transcript.scrollTop = els.transcript.scrollHeight;
    }

    async function md5Lower(text) {
      return legacyMd5(text);
    }

    function legacyMd5(s) {
      /* eslint-disable no-bitwise */
      function cmn(q, a, b, x, s, t) { a = (a + q + x + t) | 0; return (((a << s) | (a >>> (32 - s))) + b) | 0; }
      function ff(a, b, c, d, x, s, t) { return cmn((b & c) | (~b & d), a, b, x, s, t); }
      function gg(a, b, c, d, x, s, t) { return cmn((b & d) | (c & ~d), a, b, x, s, t); }
      function hh(a, b, c, d, x, s, t) { return cmn(b ^ c ^ d, a, b, x, s, t); }
      function ii(a, b, c, d, x, s, t) { return cmn(c ^ (b | ~d), a, b, x, s, t); }
      function md5cycle(x, k) {
        let a = x[0], b = x[1], c = x[2], d = x[3];
        a = ff(a, b, c, d, k[0], 7, -680876936); d = ff(d, a, b, c, k[1], 12, -389564586);
        c = ff(c, d, a, b, k[2], 17, 606105819); b = ff(b, c, d, a, k[3], 22, -1044525330);
        a = ff(a, b, c, d, k[4], 7, -176418897); d = ff(d, a, b, c, k[5], 12, 1200080426);
        c = ff(c, d, a, b, k[6], 17, -1473231341); b = ff(b, c, d, a, k[7], 22, -45705983);
        a = ff(a, b, c, d, k[8], 7, 1770035416); d = ff(d, a, b, c, k[9], 12, -1958414417);
        c = ff(c, d, a, b, k[10], 17, -42063); b = ff(b, c, d, a, k[11], 22, -1990404162);
        a = ff(a, b, c, d, k[12], 7, 1804603682); d = ff(d, a, b, c, k[13], 12, -40341101);
        c = ff(c, d, a, b, k[14], 17, -1502002290); b = ff(b, c, d, a, k[15], 22, 1236535329);
        a = gg(a, b, c, d, k[1], 5, -165796510); d = gg(d, a, b, c, k[6], 9, -1069501632);
        c = gg(c, d, a, b, k[11], 14, 643717713); b = gg(b, c, d, a, k[0], 20, -373897302);
        a = gg(a, b, c, d, k[5], 5, -701558691); d = gg(d, a, b, c, k[10], 9, 38016083);
        c = gg(c, d, a, b, k[15], 14, -660478335); b = gg(b, c, d, a, k[4], 20, -405537848);
        a = gg(a, b, c, d, k[9], 5, 568446438); d = gg(d, a, b, c, k[14], 9, -1019803690);
        c = gg(c, d, a, b, k[3], 14, -187363961); b = gg(b, c, d, a, k[8], 20, 1163531501);
        a = gg(a, b, c, d, k[13], 5, -1444681467); d = gg(d, a, b, c, k[2], 9, -51403784);
        c = gg(c, d, a, b, k[7], 14, 1735328473); b = gg(b, c, d, a, k[12], 20, -1926607734);
        a = hh(a, b, c, d, k[5], 4, -378558); d = hh(d, a, b, c, k[8], 11, -2022574463);
        c = hh(c, d, a, b, k[11], 16, 1839030562); b = hh(b, c, d, a, k[14], 23, -35309556);
        a = hh(a, b, c, d, k[1], 4, -1530992060); d = hh(d, a, b, c, k[4], 11, 1272893353);
        c = hh(c, d, a, b, k[7], 16, -155497632); b = hh(b, c, d, a, k[10], 23, -1094730640);
        a = hh(a, b, c, d, k[13], 4, 681279174); d = hh(d, a, b, c, k[0], 11, -358537222);
        c = hh(c, d, a, b, k[3], 16, -722521979); b = hh(b, c, d, a, k[6], 23, 76029189);
        a = hh(a, b, c, d, k[9], 4, -640364487); d = hh(d, a, b, c, k[12], 11, -421815835);
        c = hh(c, d, a, b, k[15], 16, 530742520); b = hh(b, c, d, a, k[2], 23, -995338651);
        a = ii(a, b, c, d, k[0], 6, -198630844); d = ii(d, a, b, c, k[7], 10, 1126891415);
        c = ii(c, d, a, b, k[14], 15, -1416354905); b = ii(b, c, d, a, k[5], 21, -57434055);
        a = ii(a, b, c, d, k[12], 6, 1700485571); d = ii(d, a, b, c, k[3], 10, -1894986606);
        c = ii(c, d, a, b, k[10], 15, -1051523); b = ii(b, c, d, a, k[1], 21, -2054922799);
        a = ii(a, b, c, d, k[8], 6, 1873313359); d = ii(d, a, b, c, k[15], 10, -30611744);
        c = ii(c, d, a, b, k[6], 15, -1560198380); b = ii(b, c, d, a, k[13], 21, 1309151649);
        a = ii(a, b, c, d, k[4], 6, -145523070); d = ii(d, a, b, c, k[11], 10, -1120210379);
        c = ii(c, d, a, b, k[2], 15, 718787259); b = ii(b, c, d, a, k[9], 21, -343485551);
        x[0] = (a + x[0]) | 0; x[1] = (b + x[1]) | 0; x[2] = (c + x[2]) | 0; x[3] = (d + x[3]) | 0;
      }
      function md5blk(s) {
        const md5blks = [];
        for (let i = 0; i < 64; i += 4) {
          md5blks[i >> 2] = s.charCodeAt(i) + (s.charCodeAt(i + 1) << 8) + (s.charCodeAt(i + 2) << 16) + (s.charCodeAt(i + 3) << 24);
        }
        return md5blks;
      }
      function md51(s) {
        const n = s.length;
        const state = [1732584193, -271733879, -1732584194, 271733878];
        let i;
        for (i = 64; i <= n; i += 64) md5cycle(state, md5blk(s.substring(i - 64, i)));
        s = s.substring(i - 64);
        const tail = new Array(16).fill(0);
        for (i = 0; i < s.length; i++) tail[i >> 2] |= s.charCodeAt(i) << ((i % 4) << 3);
        tail[i >> 2] |= 0x80 << ((i % 4) << 3);
        if (i > 55) { md5cycle(state, tail); tail.fill(0); }
        tail[14] = n * 8;
        md5cycle(state, tail);
        return state;
      }
      function rhex(n) {
        const hex = '0123456789abcdef';
        let s = '';
        for (let j = 0; j < 4; j++) s += hex.charAt((n >> (j * 8 + 4)) & 0x0f) + hex.charAt((n >> (j * 8)) & 0x0f);
        return s;
      }
      return md51(s).map(rhex).join('');
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = () => resolve();
        s.onerror = () => reject(new Error('Failed to load ' + src));
        document.head.appendChild(s);
      });
    }

    async function loadSdk(base) {
      for (const rel of SDK_SCRIPTS) {
        await loadScript(base.replace(/\/$/, '') + '/' + rel);
      }
      if (typeof CallCenter !== 'undefined' && CallCenter.toggleLanguage) {
        CallCenter.toggleLanguage('zh');
      }
    }

    function bindCallCenterCallbacks() {
      if (typeof CallCenter === 'undefined') return;
      CallCenter.opLogin_callback = function (json) {
        logPhone('签入回调: ' + JSON.stringify(json));
        if (json && (json.status === 0 || json.status === '0')) setGlobalStatus('已签入', 'ok');
      };
      CallCenter.callout_callback = function (json) {
        logPhone('外呼回调: ' + JSON.stringify(json));
      };
      CallCenter.incall_callback = function (json) {
        logPhone('通话中: ' + JSON.stringify(json));
        setGlobalStatus('通话中', 'warn');
        if (els.aiBridge.checked) startPhoneAudioBridge();
      };
      CallCenter.hangup_callback = function (json) {
        logPhone('挂机: ' + JSON.stringify(json));
        setGlobalStatus('已签入', 'ok');
        stopPhoneAudioBridge();
      };
    }

    async function rlccLogin() {
      if (typeof CallCenter === 'undefined') throw new Error('CallCenter SDK 未加载');
      const op = els.operatorId.value.trim();
      const pwd = els.password.value;
      const company = els.companyId.value.trim();
      const url3cs = els.url3cs.value.trim();
      if (!op || !pwd || !company || !url3cs) throw new Error('请填写 3CS / 企业ID / 工号 / 密码');
      const md5pwd = await md5Lower(pwd);
      const loginType = state.rlcc.login_type || '2';
      const softType = state.rlcc.softphone_type || '2';
      CallCenter.opLogin(op, md5pwd, company, loginType, '0', '', url3cs, softType);
      logPhone('发起 WebRTC 签入…');
      setGlobalStatus('签入中', 'warn');
    }

    function rlccIdle() {
      if (typeof CallCenter === 'undefined') return;
      if (CallCenter.agentIdle) CallCenter.agentIdle();
      else if (CallCenter.agentidle) CallCenter.agentidle();
      logPhone('示闲');
    }

    function rlccCallout() {
      const num = els.called.value.trim();
      if (!num) { logPhone('请输入外呼号码', true); return; }
      if (typeof CallCenter === 'undefined') return;
      CallCenter.callout(num);
      logPhone('外呼 ' + num);
    }

    function rlccHangup() {
      if (typeof CallCenter === 'undefined') return;
      if (CallCenter.hangup) CallCenter.hangup();
      logPhone('挂机');
    }

    function rlccLogout() {
      if (typeof CallCenter === 'undefined') return;
      CallCenter.logout();
      logPhone('签出');
      setGlobalStatus('未签入', '');
    }

    function wsUrl() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      return proto + '//' + location.host + '/ws-omni?mode=omni';
    }

    async function startAiSession() {
      if (state.ws && state.ws.readyState === WebSocket.OPEN) return;
      state.ws = new WebSocket(wsUrl());
      state.ws.binaryType = 'arraybuffer';
      state.aiActive = true;
      document.getElementById('btnAiStart').disabled = true;
      document.getElementById('btnAiStop').disabled = false;

      state.ws.onopen = () => {
        logAi('AI WebSocket 已连接');
        state.ws.send(JSON.stringify({
          type: 'start',
          mode: 'omni',
          stage: 'introduction',
          system_role: '',
          speaking_style: '说话专业、亲和、严谨，情绪语气平缓，像电话访谈一样自然对话。',
        }));
      };
      state.ws.onmessage = (ev) => {
        if (typeof ev.data === 'string') {
          try {
            const msg = JSON.parse(ev.data);
            if (msg.type === 'transcript' || msg.type === 'asr') {
              appendTranscript('用户', msg.text || msg.content || '');
            } else if (msg.type === 'chat_response' || msg.type === 'response_text') {
              appendTranscript('AI', msg.text || msg.content || '');
            } else if (msg.type === 'error') {
              logAi(msg.message || JSON.stringify(msg), true);
            }
          } catch (_) { /* ignore */ }
        } else if (ev.data instanceof ArrayBuffer && ev.data.byteLength > 0) {
          playAiPcm(ev.data);
        }
      };
      state.ws.onerror = () => logAi('AI WebSocket 错误', true);
      state.ws.onclose = () => {
        logAi('AI WebSocket 已关闭');
        state.aiActive = false;
        document.getElementById('btnAiStart').disabled = false;
        document.getElementById('btnAiStop').disabled = true;
      };
    }

    function stopAiSession() {
      stopPhoneAudioBridge();
      if (state.ws) {
        try { state.ws.close(); } catch (_) {}
        state.ws = null;
      }
      state.aiActive = false;
      document.getElementById('btnAiStart').disabled = false;
      document.getElementById('btnAiStop').disabled = true;
    }

    let playbackCtx = null;
    let nextPlayTime = 0;
    function playAiPcm(buf) {
      if (!playbackCtx) playbackCtx = new AudioContext({ sampleRate: 24000 });
      const i16 = new Int16Array(buf);
      const f32 = new Float32Array(i16.length);
      for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;
      const ab = playbackCtx.createBuffer(1, f32.length, 24000);
      ab.copyToChannel(f32, 0);
      const src = playbackCtx.createBufferSource();
      src.buffer = ab;
      src.connect(playbackCtx.destination);
      const t = Math.max(nextPlayTime, playbackCtx.currentTime);
      src.start(t);
      nextPlayTime = t + ab.duration;
    }

    function startPhoneAudioBridge() {
      if (!state.ws || state.ws.readyState !== WebSocket.OPEN) {
        logAi('请先启动 AI 会话再桥接电话音频', true);
        return;
      }
      stopPhoneAudioBridge();
      const remote = document.getElementById('remoteVideo');
      if (!remote || !remote.srcObject) {
        logAi('remoteVideo 尚无媒体流，稍后再试', true);
        return;
      }
      const ctx = new AudioContext({ sampleRate: 16000 });
      const src = ctx.createMediaStreamSource(remote.srcObject);
      const proc = ctx.createScriptProcessor(2048, 1, 1);
      proc.onaudioprocess = (e) => {
        if (!state.ws || state.ws.readyState !== WebSocket.OPEN) return;
        const input = e.inputBuffer.getChannelData(0);
        const out = new Int16Array(input.length);
        for (let i = 0; i < input.length; i++) {
          const s = Math.max(-1, Math.min(1, input[i]));
          out[i] = s < 0 ? s * 32768 : s * 32767;
        }
        state.ws.send(out.buffer);
      };
      src.connect(proc);
      proc.connect(ctx.destination);
      state.audioCtx = ctx;
      state.bridgeNodes = [src, proc];
      logAi('已桥接对方语音 → Omni');
    }

    function stopPhoneAudioBridge() {
      state.bridgeNodes.forEach(n => { try { n.disconnect(); } catch (_) {} });
      state.bridgeNodes = [];
      if (state.audioCtx) {
        try { state.audioCtx.close(); } catch (_) {}
        state.audioCtx = null;
      }
    }

    async function init() {
      try {
        const resp = await fetch('/api/rlcc/config');
        state.rlcc = await resp.json();
        state.sdkBase = state.rlcc.sdk_base_url || state.sdkBase;
        if (state.rlcc.url_3cs) els.url3cs.value = state.rlcc.url_3cs;
        if (state.rlcc.company_id) els.companyId.value = state.rlcc.company_id;
        if (state.rlcc.operator_id) els.operatorId.value = state.rlcc.operator_id;
        setGlobalStatus(state.rlcc.configured ? '待签入' : '未配置 RLCC', state.rlcc.configured ? '' : 'err');
      } catch (e) {
        logPhone('加载 /api/rlcc/config 失败: ' + e.message, true);
      }

      try {
        await loadSdk(state.sdkBase);
        bindCallCenterCallbacks();
        logPhone('容联云 SDK 已加载');
      } catch (e) {
        logPhone('SDK 加载失败: ' + e.message, true);
        setGlobalStatus('SDK 加载失败', 'err');
      }
    }

    document.getElementById('btnLogin').onclick = () => rlccLogin().catch(e => logPhone(e.message, true));
    document.getElementById('btnIdle').onclick = rlccIdle;
    document.getElementById('btnCall').onclick = rlccCallout;
    document.getElementById('btnHangup').onclick = rlccHangup;
    document.getElementById('btnLogout').onclick = rlccLogout;
    document.getElementById('btnAiStart').onclick = () => startAiSession();
    document.getElementById('btnAiStop').onclick = () => stopAiSession();

    init();
  </script>
</body>
</html>
