<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>芝麻背调访谈 — Omni 直连</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 1rem auto; padding: 0 1rem; }
    h1 { font-size: 1.25rem; }

    .transcript { white-space: pre-wrap; min-height: 120px; padding: 0.5rem; border: 1px solid #ccc; border-radius: 6px; margin: 0.5rem 0; background: #fafafa; }
    .controls { margin: 1rem 0; }

    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error { color: #c00; }
    .section { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #eee; }
  </style>
</head>
<body>
  <h1>芝麻背调证明人访谈（Omni 直连）</h1>
  <p style="color:#666; font-size:0.9rem;">
    新增 Omni 实现路径：浏览器音频流直连后端 Omni Bridge，使用 Omni 自带 VAD，不走原有 Duplug/本地 VAD 路径。
  </p>
  <div class="status" id="status">点击 Start 建立会话，然后直接说话。</div>
  <div class="status">
    <span>Mode:</span> <span id="modeLabel">omni</span>
    <span style="margin-left:12px;">Stage:</span> <span id="stageLabel">introduction</span>
    <span style="margin-left:12px;">VAD:</span> <span id="vadState">provider=omni state=-</span>
  </div>

  <div class="controls">
    <button id="btnStart">Start Session</button>
    <button id="btnStop" disabled>Stop</button>
    <button id="btnMute" disabled>Mute Mic</button>
  </div>

  <div class="section">
    <strong>方式一：文本输入（简化）</strong>
    <textarea id="userText" rows="3" style="width:100%; box-sizing:border-box;" placeholder="输入文本后发送（用于快速调试）"></textarea>
    <div style="margin-top:8px;">
      <button id="btnSendText" disabled>Send Text</button>
    </div>
  </div>

  <div class="section">
    <strong>ASR 实时识别（Omni）</strong>
    <div id="asrPreview" class="transcript" style="min-height:48px; font-size:0.9rem; color:#666;"></div>
  </div>

  <div class="section">
    <strong>AI 面试官回复（文本 + 语音）</strong>
    <div class="transcript" id="transcript"></div>
  </div>

  <div id="log" class="transcript" style="max-height: 120px; overflow-y: auto;"></div>

  <script>
    (function () {
      const statusEl = document.getElementById('status');
      const stageLabel = document.getElementById('stageLabel');
      const vadStateEl = document.getElementById('vadState');
      const transcriptEl = document.getElementById('transcript');
      const asrPreviewEl = document.getElementById('asrPreview');
      const logEl = document.getElementById('log');
      const btnStart = document.getElementById('btnStart');
      const btnStop = document.getElementById('btnStop');
      const btnMute = document.getElementById('btnMute');
      const btnSendText = document.getElementById('btnSendText');
      const userTextEl = document.getElementById('userText');

      let ws = null;
      let mediaStream = null;
      let audioContext = null;
      let sourceNode = null;
      let processorNode = null;
      let muteGainNode = null;
      let micMuted = false;
      let micStreamingStarted = false;

      let ttsAudioContext = null;
      const TTS_SAMPLE_RATE = 24000;
      let currentAiTextNode = null;
      let ttsNextPlayTime = 0;

      const DEFAULT_SYSTEM_ROLE = `【角色设定】
你是"芝麻背调"的专业背景调查访谈员，负责进行员工背景调查的电话/视频访谈。你需要以专业、亲和、严谨的态度完成证明人访谈，获取真实、全面的候选人信息。

【核心原则】
1. 循序渐进：先核实基础信息，再深入工作表现，最后获取综合评价
2. 交叉验证：通过不同维度的问题验证信息一致性
3. 引导式+开放式结合：当证明人回答模糊时（如"不错"），需追问具体案例和表现
4. 保密承诺：明确告知负面评价不会透露给候选人，消除顾虑
5. 情景代入：利用候选人提供的职责信息，让证明人更有代入感

【访谈六阶段流程】

=== 阶段一：开场与身份确认 ===
【目标】建立信任，确认身份，说明来意，征得同意

【标准话术】
"您好，请问是XX公司/XX先生/女士吗？我们是芝麻背调，专业做员工背景调查的第三方公司。候选人XX提供了您作为证明人，想跟您做信息核实/背景调查，可能会耽误您5-7分钟（核实履历与表现）或2-3分钟（仅核实履历），请问您目前时间方便吗？"

【关键检查点】
- 确认对方身份（公司/职位/与候选人关系）
- 说明预计时长，尊重对方时间
- 征得同意后再进入正题

=== 阶段二：基础信息核实 ===
【目标】核实候选人提供的基础履历信息，确保无虚假

【必问问题清单】
1. 入职与离职时间："关于他的入职、离职时间，您方便帮忙在人事系统查询一下吗？/您有一些印象吗？"
2. 供职方式："他的供职方式属于全职正式员工吗？"
3. 职位信息："他在公司担任什么职位呢？离职前担任什么职位？"
4. 工作职责："主要负责哪些工作呢？"
5. 工作地点："他的工作地址就是在…吧？"
6. 汇报关系："他离职前最后一任直线上级是哪一位？担任什么职位？"
7. 工作交接："他离职的时候工作交接应该都处理好了吧？/目前可能正在做工作交接是吗？"

【验证技巧】
- 先让证明人陈述，再与候选人提供的信息比对
- 对时间、职位等关键信息要求精确

=== 阶段三：离职原因与合规性排查 ===
【目标】了解离职背景，排查法律风险和职业道德问题

【必问问题清单】
1. 离职原因："关于他的离职原因，人事系统是怎么记录的？/是怎么跟您沟通的？"
   - 【追问】若属于协商离职或被动离职，需确认具体原因和是否给予赔偿
2. 合规性排查："他工作期间应该不存在违规违纪、劳动争议或仲裁的情况吧？"
3. 竞业协议："他的离职会涉及到竞业禁止协议的签订吗？"
   - 【追问】若有，"此协议在他离职之后是否会生效？实施年限是多久？"
4. 薪酬水平（可选）："他的薪酬水平方便跟您咨询吗？"

【风险识别】
- 记录离职原因的版本差异（HR记录 vs 上级口述）
- 关注任何负面信号，但保持中立语气

=== 阶段四：工作表现深度访谈（核心阶段）===
【目标】多维度评估候选人工作能力、态度和潜力

【访谈策略】
采用"引导式+开放式"结合：
- 当证明人回答"不错"等模糊评价时，必须追问：
  * "方便了解一下具体是体现在哪些方面呢？"
  * "您方便具体评价一下吗？"
  * "您方便帮忙举一个比较典型的案例吗？"
- 利用候选人提供的职责信息引导：
  * "候选人也提到了工作重点之一是负责渠道拓展，应该对前瞻性思维要求比较高，您觉得他的前瞻性思维如何？"

【七大评估维度】

维度1：优点与亮点
- "您觉得他在工作中主要有哪些优点？"
- "在与他共事期间，哪些优点令您记忆深刻？"

维度2：专业知识与技能
- "您觉得他的专业知识和技能体现得如何？"
- "这个岗位需要具备的专业知识及技能，他在哪方面表现较为突出？"
- "是否属于工作经验比较丰富的员工，在公司属于中（高）层管理人员？"
- "提供个人专业知识帮助团队员工解决问题的能力如何？"
- "自主学习能力如何？对业务的理解情况如何？"

维度3：压力管理
- "请问他在工作中承担的压力会比较大吗？压力主要来自于哪些方面？"
- "他的抗压能力怎么样？情绪自我控制能力如何？"
- "应该还是能保持积极的态度来应对出现的问题和困难吧？"
- "遇到无法处理的问题，是否会主动寻求上级领导的帮助支持？"
- "会通过哪些方式来化解压力？"
- 【管理岗追问】"下属/同事压力大时是否能够帮忙调解压力？"

维度4：工作态度
- "您觉得他在工作体现出来的工作态度如何？"
- "应该是比较认真负责踏实敬业的员工吧？"
- "分配的工作任务应该还是可以很好地完成吧？"
- "能否保持职业的态度处理工作中遇到的问题？"
- "是否愿意接受具有挑战性的工作？"

维度5：人际关系
- "您觉得他在工作中人际关系处理得怎么样？"
- "与上级同事相处得怎么样？"（关注：融入团队、团队协作、跨部门沟通、高效准确沟通）
- "在与公司外部的沟通、客户关系的维护表现怎样？"（商务沟通能力）

维度6：领导与管理能力（针对管理岗）
- "请问他在工作中会承担领导管理的职责吗？工作中会带领几名下属？"
- "是否能根据员工能力和特点合理分配工作任务？"
- "属于哪种领导风格的领导？"
- "对下属的培养和指导体现得怎么样？"
  * （关注：下属潜能与可塑性、分享经验、指导进步、职业规划、合理放权、激励培养）
- "您觉得他作为领导在项目的推动能力、全局统筹能力体现得如何？"
- "他作为领导在团队中的影响力怎么样？团队文化建设做得如何？"
  * （关注：团队工作表现、绩效、凝聚力、文化建设、鼓舞士气、稳定性、协调分歧）
- 【追问】"会通过哪些方式鼓舞员工的工作士气？会通过哪些方式调动大家的工作积极性？"

维度7：前瞻性思维（针对中高层/战略岗）
- "请问他的工作岗位会涉及到前瞻性思维的体现吗？"
- 【追问】"从哪些案例中能够体现出较强的前瞻性思维能力？"
- "他对市场和行业的分析和把控体现得怎么样？"
  * （关注：市场/行业敏感度、洞察力、行业评估、预判能力、动态掌握）
- "请问他对工作中风险的评估和预判能力如何？"
- "是否能提前制定方案策略来应对、屏蔽可能存在的风险和问题？"
- 【追问】"会通过哪些方式屏蔽工作中可能存在的风险或问题？"
- "他工作中的计划性怎么样？是否能主动提出可行性方案？"
- "是否会主动学习所在行业前沿知识？"
- 【追问】"做过哪些创新项目或提出过哪些新颖的观点？"

=== 阶段五：综合评价与闭环 ===
【目标】获取量化评分、改进建议，验证证明人可靠性

【必问问题清单】
1. 量化评分："如果满分为10分的话，您会给候选人打几分？/根据他整体的岗位匹配度评分？"
2. 再雇佣意愿："如果有再次共事机会，您是否愿意再次雇用他跟他一起共事呢？"
3. 缺点与不足："如果请您帮他提出一些建议，您认为他在哪些方面还有提升和完善的空间？"
   - 【负面评价追问话术】"其实问您这个问题并不是要说评价候选人不好的地方，而是想了解一下他在这方面具体有哪些不足，他入职后我们可以想办法帮他提升，您给出的建议用人方也能参考并更有针对性地培养候选人。关于这方面的信息我们也是绝对不会透露给XX（候选人）的，这个您可以放心。"
4. 证明人信息核对："方便了解一下您怎么称呼/担任什么职位吗？"
5. 交叉验证信息："他还给我们提供了一位同事XXX，您看是公司的……（职位）吗？同事的联系方式方便跟您核对吗？"

=== 阶段六：结束语 ===
【标准话术】
"主要与您了解以上的内容，抱歉打扰您了，也非常感谢您的配合，祝您生活愉快，再见！"

【特殊情况处理】

情况1：证明人时间紧张
- 快速模式：仅核实基础信息（阶段二）+ 评分（阶段五），控制在2-3分钟

情况2：证明人回避负面评价
- 使用保密承诺话术消除顾虑
- 换角度提问："如果给候选人提一个改进建议？"
- 询问"更适合什么类型的工作"而非"不适合什么"

情况3：信息不一致
- 不直接质疑，用求证语气："我们了解到的情况是XX，想跟您确认一下？"
- 记录差异点，后续与其他证明人交叉验证

情况4：证明人表示不了解候选人
- 询问共事时长和接触频率
- 若确实不了解，礼貌结束，标记需补充其他证明人

【输出要求】
1. 按阶段顺序推进，不可跳过基础信息核实直接进入表现评价
2. 每个维度获取具体案例支撑，拒绝模糊评价
3. 记录原话，标注证明人语气（肯定/犹豫/回避）
4. 对矛盾信息标记待验证
5. 访谈结束后生成结构化报告，包含：信息核实结果、各维度评价、风险提示、综合建议`;

      const DEFAULT_SPEAKING_STYLE = `说话专业、亲和、严谨，适合电话/视频背景调查访谈。`;

      function log(msg, isError) {
        const p = document.createElement('div');
        if (isError) p.className = 'error';
        p.textContent = new Date().toISOString().slice(11, 19) + ' ' + msg;
        logEl.appendChild(p);
        logEl.scrollTop = logEl.scrollHeight;
      }

      function setStatus(text) { statusEl.textContent = text; }

      function getTtsAudioContext() {
        if (!ttsAudioContext) ttsAudioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: TTS_SAMPLE_RATE });
        if (ttsAudioContext.state === 'suspended') ttsAudioContext.resume().catch(function () {});
        return ttsAudioContext;
      }

      function pcmS16ToFloat32(pcmS16) {
        const inLen = pcmS16.length / 2;
        const inView = new DataView(pcmS16.buffer, pcmS16.byteOffset, pcmS16.byteLength);
        const out = new Float32Array(inLen);
        for (let i = 0; i < inLen; i++) out[i] = inView.getInt16(i * 2, true) / 32768;
        return out;
      }

      function playTTSChunk(pcmS16) {
        if (!pcmS16 || pcmS16.length === 0) return;
        const ctx = getTtsAudioContext();
        const pcmF32 = pcmS16ToFloat32(pcmS16);
        const buf = ctx.createBuffer(1, pcmF32.length, TTS_SAMPLE_RATE);
        buf.copyToChannel(pcmF32, 0);
        const src = ctx.createBufferSource();
        src.buffer = buf;
        src.connect(ctx.destination);
        const guardSec = 0.02;
        const now = ctx.currentTime;
        if (ttsNextPlayTime < now + guardSec) {
          ttsNextPlayTime = now + guardSec;
        }
        src.start(ttsNextPlayTime);
        ttsNextPlayTime += buf.duration;
      }

      function ensureAiLine() {
        if (currentAiTextNode) return currentAiTextNode;
        transcriptEl.appendChild(document.createElement('br'));
        const p = document.createElement('span');
        p.textContent = 'AI: ';
        transcriptEl.appendChild(p);
        currentAiTextNode = document.createTextNode('');
        transcriptEl.appendChild(currentAiTextNode);
        transcriptEl.appendChild(document.createElement('br'));
        return currentAiTextNode;
      }

      function getMicAudioContext() {
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        if (audioContext.state === 'suspended') audioContext.resume().catch(function () {});
        return audioContext;
      }

      function startMicStreaming() {
        if (micStreamingStarted) return;
        if (!mediaStream || !ws || ws.readyState !== WebSocket.OPEN) return;
        const ctx = getMicAudioContext();
        sourceNode = ctx.createMediaStreamSource(mediaStream);
        processorNode = ctx.createScriptProcessor(2048, 1, 1);
        muteGainNode = ctx.createGain();
        muteGainNode.gain.value = 0;
        const ratio = ctx.sampleRate / 16000;
        const outSamples = 320;
        const requiredIn = Math.ceil((outSamples - 1) * ratio) + 1;
        let buffer = [];

        processorNode.onaudioprocess = function (e) {
          if (micMuted) return;
          const input = e.inputBuffer.getChannelData(0);
          for (let i = 0; i < input.length; i++) buffer.push(input[i]);
          while (buffer.length >= requiredIn) {
            const s16 = new ArrayBuffer(outSamples * 2);
            const view = new DataView(s16);
            for (let k = 0; k < outSamples; k++) {
              const pos = k * ratio;
              const idx = Math.floor(pos);
              const frac = pos - idx;
              const s0 = buffer[idx] || 0;
              const s1 = buffer[idx + 1] || s0;
              const s = Math.max(-1, Math.min(1, s0 + (s1 - s0) * frac));
              view.setInt16(k * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            }
            buffer.splice(0, Math.floor(outSamples * ratio));
            if (ws && ws.readyState === WebSocket.OPEN) ws.send(s16);
          }
        };

        sourceNode.connect(processorNode);
        processorNode.connect(muteGainNode);
        muteGainNode.connect(ctx.destination);
        micStreamingStarted = true;
      }

      function stopMicStreaming() {
        if (processorNode) { try { processorNode.disconnect(); } catch (e) {} processorNode = null; }
        if (muteGainNode) { try { muteGainNode.disconnect(); } catch (e) {} muteGainNode = null; }
        if (sourceNode) { try { sourceNode.disconnect(); } catch (e) {} sourceNode = null; }
        if (audioContext) { try { audioContext.close(); } catch (e) {} audioContext = null; }
        micStreamingStarted = false;
      }

      function connect() {
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const url = protocol + '//' + location.host + '/ws-omni';
        ws = new WebSocket(url);
        ws.binaryType = 'arraybuffer';
        setStatus('Connecting Omni...');

        ws.onopen = function () {
          ws.send(JSON.stringify({
            mode: 'omni',
            stage: 'introduction',
            system_role: DEFAULT_SYSTEM_ROLE,
            speaking_style: DEFAULT_SPEAKING_STYLE
          }));
        };

        ws.onmessage = function (ev) {
          if (typeof ev.data === 'string') {
            let msg = {};
            try { msg = JSON.parse(ev.data); } catch (e) { return; }
            if (msg.type === 'ready') {
              setStatus('Omni 已就绪，直接说话即可。');
              log('ready model=' + (msg.omni_model || '-') + ' voice=' + (msg.omni_voice || '-'));
              btnSendText.disabled = false;
              startMicStreaming();
            } else if (msg.type === 'asr') {
              asrPreviewEl.textContent = msg.text || '';
              asrPreviewEl.style.opacity = msg.is_interim ? '0.7' : '1';
              if (!msg.is_interim && (msg.text || '').trim()) {
                transcriptEl.appendChild(document.createElement('br'));
                const userSpan = document.createElement('span');
                userSpan.textContent = '证明人: ' + msg.text;
                userSpan.style.color = '#666';
                transcriptEl.appendChild(userSpan);
                transcriptEl.appendChild(document.createElement('br'));
                transcriptEl.scrollTop = transcriptEl.scrollHeight;
                currentAiTextNode = null;
              }
            } else if (msg.type === 'chat') {
              const node = ensureAiLine();
              node.textContent += (msg.content || '');
              transcriptEl.scrollTop = transcriptEl.scrollHeight;
            } else if (msg.type === 'chat_end') {
              currentAiTextNode = null;
              if (ttsAudioContext) {
                const now = ttsAudioContext.currentTime;
                if (ttsNextPlayTime < now) ttsNextPlayTime = now;
              } else {
                ttsNextPlayTime = 0;
              }
            } else if (msg.type === 'vad_state') {
              vadStateEl.textContent = 'provider=' + (msg.provider || '-') + ' state=' + (msg.state || '-');
            } else if (msg.type === 'error') {
              log(msg.message || 'unknown error', true);
            } else if (msg.type === 'server_log') {
              log((msg.message || '').trim());
            }
          } else {
            playTTSChunk(new Uint8Array(ev.data));
          }
        };

        ws.onclose = function () {
          setStatus('Disconnected');
          btnSendText.disabled = true;
          log('WebSocket closed');
        };
        ws.onerror = function () {
          setStatus('WebSocket error');
          log('WebSocket error', true);
        };
      }

      btnStart.onclick = function () {
        transcriptEl.innerHTML = '';
        asrPreviewEl.textContent = '';
        logEl.innerHTML = '';
        stageLabel.textContent = 'introduction';
        vadStateEl.textContent = 'provider=omni state=-';
        navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 },
          video: false,
        }).then(function (stream) {
          mediaStream = stream;
          connect();
          btnStart.disabled = true;
          btnStop.disabled = false;
          btnMute.disabled = false;
        }).catch(function (e) {
          log('麦克风权限失败: ' + e.message, true);
        });
      };

      btnStop.onclick = function () {
        if (mediaStream) {
          mediaStream.getTracks().forEach(function (t) { t.stop(); });
          mediaStream = null;
        }
        stopMicStreaming();
        if (ws) { ws.close(); ws = null; }
        btnStart.disabled = false;
        btnStop.disabled = true;
        btnMute.disabled = true;
        btnSendText.disabled = true;
        setStatus('Stopped');
      };

      btnMute.onclick = function () {
        micMuted = !micMuted;
        btnMute.textContent = micMuted ? 'Unmute Mic' : 'Mute Mic';
      };

      btnSendText.onclick = function () {
        const text = (userTextEl.value || '').trim();
        if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({ type: 'chat_text_query', content: text }));
        transcriptEl.appendChild(document.createElement('br'));
        const userSpan = document.createElement('span');
        userSpan.textContent = '证明人: ' + text;
        userSpan.style.color = '#666';
        transcriptEl.appendChild(userSpan);
        transcriptEl.appendChild(document.createElement('br'));
        transcriptEl.scrollTop = transcriptEl.scrollHeight;
        userTextEl.value = '';
      };
    })();
  </script>
</body>
</html>
